<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- ══════════ Tame Impala Currents SVG Background ══════════ -->
  <svg class="bg-art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow1" cx="50%" cy="45%" r="60%">
        <stop offset="0%"   stop-color="#e8a0bf" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#0d1321" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow2" cx="30%" cy="60%" r="50%">
        <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#0d1321" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow3" cx="75%" cy="35%" r="40%">
        <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#0d1321" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="ripple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#ec4899" stop-opacity="0.12"/>
        <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.06"/>
      </linearGradient>
      <linearGradient id="lily-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
      <linearGradient id="lily-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#e8a0bf"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
      <linearGradient id="lily-stem" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#34d399" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
      </linearGradient>
    </defs>

    <!-- Deep base -->
    <rect width="1440" height="900" fill="#0d1321"/>

    <!-- Ambient glow orbs -->
    <ellipse cx="720" cy="420" rx="600" ry="400" fill="url(#glow1)"/>
    <ellipse cx="400" cy="550" rx="450" ry="350" fill="url(#glow2)"/>
    <ellipse cx="1050" cy="300" rx="350" ry="300" fill="url(#glow3)"/>

    <!-- Currents-style concentric ripples -->
    <g opacity="0.4">
      <circle cx="720" cy="450" r="80"  fill="none" stroke="#e8a0bf" stroke-width="0.6"/>
      <circle cx="720" cy="450" r="130" fill="none" stroke="#d97ab8" stroke-width="0.5"/>
      <circle cx="720" cy="450" r="190" fill="none" stroke="#c464a8" stroke-width="0.5"/>
      <circle cx="720" cy="450" r="260" fill="none" stroke="#b35399" stroke-width="0.4"/>
      <circle cx="720" cy="450" r="340" fill="none" stroke="#a04488" stroke-width="0.4"/>
      <circle cx="720" cy="450" r="430" fill="none" stroke="#8b3677" stroke-width="0.3"/>
      <circle cx="720" cy="450" r="530" fill="none" stroke="#762a66" stroke-width="0.3"/>
      <circle cx="720" cy="450" r="640" fill="none" stroke="#5e1f55" stroke-width="0.2"/>
    </g>

    <!-- Flowing Currents curves -->
    <g opacity="0.18">
      <path d="M0 500 Q 360 350 720 450 T 1440 400" fill="none" stroke="#e8a0bf" stroke-width="1.2"/>
      <path d="M0 530 Q 360 380 720 480 T 1440 430" fill="none" stroke="#d97ab8" stroke-width="1"/>
      <path d="M0 560 Q 360 410 720 510 T 1440 460" fill="none" stroke="#c464a8" stroke-width="0.8"/>
      <path d="M0 350 Q 400 280 720 380 T 1440 340" fill="none" stroke="#7c3aed" stroke-width="0.8"/>
      <path d="M0 380 Q 400 310 720 410 T 1440 370" fill="none" stroke="#6d28d9" stroke-width="0.6"/>
    </g>

    <!-- ═══ Lilies ═══ -->

    <!-- Lily 1 — large, center-left -->
    <g transform="translate(280, 620)" opacity="0.55">
      <line x1="0" y1="0" x2="0" y2="60" stroke="url(#lily-stem)" stroke-width="1.5"/>
      <path d="M0 0 Q -18 -25 -8 -45 Q 0 -30 0 0" fill="url(#lily-grad1)" opacity="0.7"/>
      <path d="M0 0 Q 18 -25 8 -45 Q 0 -30 0 0" fill="url(#lily-grad2)" opacity="0.6"/>
      <path d="M0 0 Q -30 -10 -28 -35 Q -5 -20 0 0" fill="url(#lily-grad1)" opacity="0.5"/>
      <path d="M0 0 Q 30 -10 28 -35 Q 5 -20 0 0" fill="url(#lily-grad2)" opacity="0.5"/>
      <ellipse cx="0" cy="-5" rx="3" ry="3" fill="#fbbf24" opacity="0.8"/>
    </g>

    <!-- Lily 2 — upper right -->
    <g transform="translate(1100, 200) scale(0.8)" opacity="0.45">
      <line x1="0" y1="0" x2="-10" y2="50" stroke="url(#lily-stem)" stroke-width="1.2"/>
      <path d="M0 0 Q -15 -22 -6 -38 Q 0 -25 0 0" fill="url(#lily-grad2)" opacity="0.7"/>
      <path d="M0 0 Q 15 -22 6 -38 Q 0 -25 0 0" fill="url(#lily-grad1)" opacity="0.6"/>
      <path d="M0 0 Q -25 -8 -22 -30 Q -4 -16 0 0" fill="url(#lily-grad2)" opacity="0.45"/>
      <path d="M0 0 Q 25 -8 22 -30 Q 4 -16 0 0" fill="url(#lily-grad1)" opacity="0.45"/>
      <ellipse cx="0" cy="-4" rx="2.5" ry="2.5" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Lily 3 — bottom right, small -->
    <g transform="translate(1200, 720) scale(0.6)" opacity="0.35">
      <line x1="0" y1="0" x2="5" y2="40" stroke="url(#lily-stem)" stroke-width="1"/>
      <path d="M0 0 Q -12 -20 -5 -32 Q 0 -20 0 0" fill="url(#lily-grad1)" opacity="0.6"/>
      <path d="M0 0 Q 12 -20 5 -32 Q 0 -20 0 0" fill="url(#lily-grad2)" opacity="0.6"/>
      <path d="M0 0 Q -20 -6 -18 -24 Q -3 -14 0 0" fill="url(#lily-grad1)" opacity="0.4"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Lily 4 — far left, small -->
    <g transform="translate(80, 350) scale(0.5)" opacity="0.3">
      <line x1="0" y1="0" x2="-5" y2="35" stroke="url(#lily-stem)" stroke-width="1"/>
      <path d="M0 0 Q -10 -18 -4 -28 Q 0 -18 0 0" fill="url(#lily-grad2)" opacity="0.6"/>
      <path d="M0 0 Q 10 -18 4 -28 Q 0 -18 0 0" fill="url(#lily-grad1)" opacity="0.5"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2" fill="#fbbf24" opacity="0.6"/>
    </g>

    <!-- Lily 5 — center top, abstract -->
    <g transform="translate(700, 120) scale(0.7)" opacity="0.3">
      <path d="M0 0 Q -14 -22 -5 -36 Q 0 -22 0 0" fill="#e8a0bf" opacity="0.5"/>
      <path d="M0 0 Q 14 -22 5 -36 Q 0 -22 0 0" fill="#d97ab8" opacity="0.4"/>
      <path d="M0 0 Q -22 -6 -20 -22 Q -3 -12 0 0" fill="#c464a8" opacity="0.35"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2" fill="#fbbf24" opacity="0.6"/>
    </g>

    <!-- Lily pad (abstract floating circles) -->
    <ellipse cx="300" cy="640" rx="45" ry="20" fill="#059669" opacity="0.12" transform="rotate(-8 300 640)"/>
    <ellipse cx="1120" cy="220" rx="35" ry="16" fill="#059669" opacity="0.1" transform="rotate(12 1120 220)"/>
    <ellipse cx="1180" cy="740" rx="30" ry="14" fill="#059669" opacity="0.08" transform="rotate(-5 1180 740)"/>

    <!-- Soft floating particles -->
    <g opacity="0.3">
      <circle cx="200" cy="200" r="1.5" fill="#e8a0bf"/>
      <circle cx="500" cy="150" r="1"   fill="#d97ab8"/>
      <circle cx="900" cy="250" r="1.2" fill="#fbbf24"/>
      <circle cx="1300" cy="180" r="1"  fill="#7c3aed"/>
      <circle cx="350" cy="750" r="1.3" fill="#e8a0bf"/>
      <circle cx="800" cy="800" r="1"   fill="#d97ab8"/>
      <circle cx="1100" cy="650" r="1.5" fill="#fbbf24"/>
      <circle cx="600" cy="500" r="0.8" fill="#c464a8"/>
    </g>

    <!-- Noise/grain overlay for texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="1440" height="900" filter="url(#grain)" opacity="0.04"/>
  </svg>


  <!-- ══════════ Chat — upper right, translucent ══════════ -->
  <div class="chat-panel">
    <div class="chat-header">
      <span class="chat-title">Live Chat</span>
      <span class="chat-dot"></span>
    </div>
    <div id="chat-messages" class="chat-messages">
      <div class="chat-sys">Welcome to Vibe Radio</div>
    </div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" placeholder="Type a message..." maxlength="200" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>


  <!-- ══════════ Levitating Player ══════════ -->
  <div class="player-float">
    <div class="player-card">

      <!-- Now Playing -->
      <div class="now-playing">
        <div class="art-ring">
          <div class="art-inner">
            <span class="art-icon">♪</span>
          </div>
        </div>
        <div class="track-meta">
          <div class="label-now">Now Playing</div>
          <div id="np-title" class="track-title">Loading...</div>
          <div id="np-artist" class="track-artist">Vibe Radio</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="play-btn" class="play-btn" aria-label="Play">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="icon-play">
            <polygon points="6,3 20,12 6,21"/>
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="icon-pause" style="display:none">
            <rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>
          </svg>
        </button>
        <div class="vol-wrap">
          <span class="vol-icon">🔊</span>
          <input type="range" id="vol" min="0" max="100" value="70" class="vol-slider">
        </div>
        <span id="listeners" class="listener-count">0 online</span>
      </div>

      <audio id="stream" preload="none">
        <source src="http://localhost:8000/radio" type="audio/mpeg">
      </audio>

      <!-- Queue -->
      <div class="queue-section">
        <div class="queue-label">Up Next</div>
        <div id="queue-list" class="queue-list"></div>
      </div>

    </div>
  </div>


  <script src="/js/player.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
